# Reference deployment: PorterClaude behind nginx-proxy + acme-companion, socket mode.
# OWNER: O2. Rendered by deploy/deploy.sh (dollar-brace variables are substituted from
# deploy/.env, with :- defaults) and pushed to Portainer as the stack named by STACK_NAME.
#
# APP_PASSWORD is deliberately NOT substituted (deploy.sh --keep): it stays literal in the
# rendered file and is passed to Portainer in the stack `env` array instead, so the password
# is stored once by Portainer and never written into deploy/.build/stack.yml.
#
# The app runs as uid 10001 (non-root). To use /var/run/docker.sock it must be in the
# socket's group, hence `group_add` below:
#     ssh <docker-host> stat -c %g /var/run/docker.sock     # -> put that gid in DOCKER_GID
# Portainer mode (PORTERCLAUDE_BACKEND=portainer) needs no socket and no group_add at all.
services:
  porterclaude:
    image: ${APP_IMAGE:-ghcr.io/lostphysx/porterclaude:latest}
    container_name: porterclaude
    restart: unless-stopped
    init: true
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      VIRTUAL_HOST: ${APP_HOSTNAME}
      LETSENCRYPT_HOST: ${APP_HOSTNAME}
      VIRTUAL_PORT: 8080
      PORTERCLAUDE_BACKEND: socket
      TRUST_PROXY: "1"
      COOKIE_SECURE: auto
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # MUST persist: holds secret.key (encrypts the stored Portainer key) + config.json.
      # Losing it logs everyone out and makes the stored key undecryptable.
      - porterclaude-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    networks:
      - ${PROXY_NETWORK_APP:-portainer_dmz}
      - ${PROXY_NETWORK_EDGE:-portainer_gate}
    # No `healthcheck:` here on purpose — the image ships its own HEALTHCHECK that calls
    # /api/health with node's built-in fetch. The runtime image has neither wget nor curl,
    # so overriding it with a wget/curl command would mark the container unhealthy forever.

networks:
  ${PROXY_NETWORK_APP:-portainer_dmz}:
    external: true
  ${PROXY_NETWORK_EDGE:-portainer_gate}:
    external: true

volumes:
  porterclaude-data:
