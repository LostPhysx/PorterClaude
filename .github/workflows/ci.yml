# PorterClaude CI. OWNER: O2. Spec: docs/design/orchestration.md §8.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # package-lock.json IS committed (O1 request 1), so setup-node's npm cache works.
          cache: npm
      - name: install
        run: |
          # the lock file is present today, so this always takes the `npm ci` branch; the
          # fallback only exists so the workflow still runs if the lock is ever dropped.
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  scripts:
    name: shell + python + dry-run deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax floor
        run: |
          # v0.2: deletion-proof. Every shell script under deploy/ and docker/ is checked
          # with the interpreter its shebang names, so adding or removing an agent
          # installer needs no workflow change (orchestration.md §16).
          fail=0
          while IFS= read -r f; do
            case "$(head -n1 "$f")" in
              *"/bin/sh"*)  echo "sh   -n $f"; sh   -n "$f" || fail=1 ;;
              *bash*)       echo "bash -n $f"; bash -n "$f" || fail=1 ;;
              *)            echo "sh   -n $f (no shebang)"; sh -n "$f" || fail=1 ;;
            esac
          done < <(find deploy docker -type f -name '*.sh' | sort)
          exit $fail
      - name: shellcheck
        run: |
          shellcheck --version
          # -x so the `. "$PC_TOOLS_SRC/lib/*.sh"` sources are followed via the
          # `# shellcheck source=` directives in the tools scripts.
          find deploy docker -type f -name '*.sh' -print0             | sort -z | xargs -0 shellcheck -x -S warning
          # A skeleton silences its own "unused / never called" noise with a blanket header.
          # None may survive in the shipped tree, or shellcheck above would be checking nothing.
          if grep -rn 'shellcheck disable=SC2034,SC2119,SC2120,SC2317' deploy docker; then
            echo "a blanket shellcheck-disable header survived"; exit 1
          fi
      - name: python helpers compile
        run: |
          python3 -m compileall -q deploy/lib
          find deploy -name __pycache__ -type d -prune -exec rm -rf {} +
      - name: build-stream fails on everything that is not a built image
        run: |
          # Regression guard: build-stream used to exit 0 for a Portainer error object, an
          # nginx error page, an empty body or a stream cut short, so deploy.sh shipped a
          # stale image. Only a real success marker may exit 0.
          # each helper reads the canned response body from stdin and returns non-zero (which
          # `set -e` turns into a failed step) when build-stream disagrees with the contract
          expect_fail() {
            if python3 deploy/lib/portainer.py build-stream >/dev/null 2>&1; then
              echo "FAIL: build-stream accepted $1"; return 1
            fi
          }
          expect_ok() {
            if ! python3 deploy/lib/portainer.py build-stream >/dev/null 2>&1; then
              echo "FAIL: build-stream rejected $1"; return 1
            fi
          }
          printf '%s' '{"message":"Unauthorized","details":"Invalid API key"}' | expect_fail "a portainer error object"
          printf '%s' '<html><body>504 Gateway Time-out</body></html>' | expect_fail "an html error page"
          printf '' | expect_fail "an empty body"
          printf '%s\n' '{"stream":"Step 1/3 : FROM node:22"}' | expect_fail "a truncated stream"
          printf '%s\n' '{"errorDetail":{"message":"boom"},"error":"boom"}' | expect_fail "a docker build error"
          printf '%s\n' '{"stream":"Successfully built abc123"}' '{"aux":{"ID":"sha256:abc"}}' | expect_ok "a real build"
          echo "build-stream contract ok"
      - name: deploy.sh --dry-run (no network, dummy env)
        run: |
          # deploy/.env.example holds placeholders only — never a real key.
          cp deploy/.env.example deploy/.env.ci
          bash deploy/deploy.sh --dry-run --env-file deploy/.env.ci
          test -s deploy/.build/context.tar
          test -s deploy/.build/stack.yml
      - name: assert the build context
        run: |
          tar -tf deploy/.build/context.tar > /tmp/context.txt
          grep -qx 'docker/Dockerfile' /tmp/context.txt
          grep -qx 'server/package.json' /tmp/context.txt
          grep -qx 'web/package.json' /tmp/context.txt
          if grep -qE '(^|/)deploy/\.env' /tmp/context.txt; then
            echo "SECURITY: deploy/.env* is inside the build context"; exit 1
          fi
          if grep -qE '(^|/)(node_modules|\.git)/' /tmp/context.txt; then
            echo "context contains node_modules/ or .git/"; exit 1
          fi
      - name: assert the rendered stack file
        run: |
          grep -q 'claude.example.com' deploy/.build/stack.yml
          grep -qF 'porterclaude:local' deploy/.build/stack.yml
          # the password must NOT be substituted: it travels in the Portainer stack env array
          grep -qF '${APP_PASSWORD}' deploy/.build/stack.yml
      - name: deploy.sh --image renders a registry image and skips the build
        run: |
          rm -f deploy/.build/stack.yml
          bash deploy/deploy.sh --dry-run --image ghcr.io/example/porterclaude:v9.9.9 \
            --env-file deploy/.env.ci
          grep -qF 'ghcr.io/example/porterclaude:v9.9.9' deploy/.build/stack.yml
          # --image is the no-build mode, so it must refuse --build-only instead of building
          if bash deploy/deploy.sh --image x --build-only --env-file deploy/.env.ci; then
            echo "--image --build-only should have failed"; exit 1
          fi
          # restore the ordinary artifacts for the upload step below
          bash deploy/deploy.sh --dry-run --env-file deploy/.env.ci
      - name: host-prep.sh --dry-run changes nothing and needs an action
        run: |
          # portainer.example.com does not resolve: the dry run must still describe the plan.
          bash deploy/host-prep.sh --dry-run --clean --prune --vhost --reload \
            --env-file deploy/.env.ci
          if bash deploy/host-prep.sh --dry-run --env-file deploy/.env.ci; then
            echo "host-prep.sh without an action should have failed"; exit 1
          fi
      - name: tools installer plan mode (no network, no writes)
        run: |
          # orchestration.md §16/§18.2: `--plan` parses PORTERCLAUDE_AGENTS, prints ONE line
          # per agent ending in `-> agents/<id>`, writes nothing and reaches no network.
          # One spec per install kind, so every branch of the driver is parsed here.
          out="$(mktemp -d)"
          specs='[
            {"id":"claude","command":"claude","versionCommand":["claude","--version"],
             "install":{"kind":"script","url":"https://claude.ai/install.sh","binPath":"bin/claude"}},
            {"id":"opencode","command":"opencode","versionCommand":["opencode","--version"],
             "install":{"kind":"script","url":"https://opencode.ai/install","binPath":"bin/opencode"}},
            {"id":"gemini","command":"gemini","versionCommand":["gemini","--version"],
             "install":{"kind":"npm","package":"@google/gemini-cli","version":"latest","bin":"gemini"}},
            {"id":"aider","command":"aider","versionCommand":["aider","--version"],
             "install":{"kind":"pip","package":"aider-chat","bin":"aider","preferUv":true}},
            {"id":"demo-binary","command":"demo","versionCommand":["demo","--version"],
             "install":{"kind":"binary","archive":"tar.gz","path":"dist/demo","urls":{
               "linux-x64":"https://example.invalid/demo-x64.tar.gz",
               "linux-arm64":"https://example.invalid/demo-arm64.tar.gz"}}}
          ]'
          if ! env PORTERCLAUDE_AGENTS="$specs" OUT="$out" PORTERCLAUDE_TOOLS_MOUNT="$out/mount" bash docker/tools/install-agents.sh --plan > /tmp/plan.txt 2>&1; then
            echo "--plan exited non-zero:"; cat /tmp/plan.txt; exit 1
          fi
          cat /tmp/plan.txt
          # exactly one plan line per agent, and no line for an agent that was not asked for
          for row in "claude claude script" "opencode opencode script" "gemini gemini npm" "aider aider pip" "demo-binary demo binary"; do
            set -- $row
            n="$(grep -cE -- "\($2\):[[:space:]]+$3([[:space:]]|$).*->[[:space:]]*agents/$1[[:space:]]*$" /tmp/plan.txt || true)"
            if [ "$n" != "1" ]; then
              echo "expected exactly 1 plan line for $1 ($3), got $n"; exit 1
            fi
          done
          total="$(grep -cE -- "->[[:space:]]*agents/" /tmp/plan.txt || true)"
          if [ "$total" != "5" ]; then
            echo "expected 5 plan lines in total, got $total"; exit 1
          fi
          # QA B-4: a kind:script installer must not be forced through /bin/sh (dash on
          # debian) — opencode's installer is bash and dies on `set -o pipefail` there.
          if grep -qE '[[:space:]]sh "\$installer"' docker/tools/lib/kinds.sh; then
            echo "script installers must run under their interpreter (pc_script_interpreter), not plain sh"
            exit 1
          fi
          grep -q 'pc_script_interpreter' docker/tools/lib/kinds.sh || {
            echo "lib/kinds.sh lost pc_script_interpreter (QA B-4)"; exit 1; }
          # a broken spec is a server bug, not an agent problem: refuse it before writing
          if env PORTERCLAUDE_AGENTS='[{"id":' OUT="$out" bash docker/tools/install-agents.sh --plan >/dev/null 2>&1; then
            echo "--plan accepted malformed PORTERCLAUDE_AGENTS"; exit 1
          fi
          if [ -n "$(ls -A "$out")" ]; then
            echo "--plan wrote into OUT"; ls -la "$out"; exit 1
          fi
      - name: recipes ship no coding agent
        run: |
          # v0.2: agents come from the tools volume only (orchestration.md §15).
          if grep -RniE 'claude\.ai/install|install\.sh[[:space:]]*\|[[:space:]]*(ba)?sh' docker/recipes/; then
            echo "a recipe installs a coding agent"; exit 1
          fi
          if grep -RniE 'ARG[[:space:]]+CLAUDE_VERSION' docker/recipes/; then
            echo "a recipe still declares ARG CLAUDE_VERSION"; exit 1
          fi
      - name: tools payload contracts
        run: |
          # the session bootstrap must consume the server's link table …
          grep -q 'PORTERCLAUDE_AGENT_LINKS' docker/tools/entrypoint.sh
          # … and every per-agent override must name an id the server actually ships
          for f in docker/tools/agents/*.sh; do
            id="$(basename "$f" .sh)"
            if ! grep -q "id: '$id'" server/src/agents/builtin.ts; then
              echo "unknown agent override: $f (no such id in server/src/agents/builtin.ts)"; exit 1
            fi
          done
          # v0.1's claude-only downloader is folded into agents/claude.sh (change list §11.4)
          if [ -e docker/tools/fetch-claude.sh ]; then
            echo "docker/tools/fetch-claude.sh must be deleted in v0.2"; exit 1
          fi
          # AGENTS.json is the tools half of ToolsAgentManifest (server/src/agents/model.ts)
          for key in syncedAt id command installed version error; do
            grep -q "$key" server/src/agents/model.ts || { echo "model.ts lost $key"; exit 1; }
            grep -q "$key" docker/tools/install-agents.sh || { echo "AGENTS.json writer lost $key"; exit 1; }
          done
          # installedAt belongs to the API view (HostAgentView), never to the volume manifest
          if grep -q 'installedAt' docker/tools/install-agents.sh; then
            echo "the AGENTS.json writer emits a key ToolsAgentManifest does not have"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-stack
          path: deploy/.build/stack.yml
          retention-days: 7

  compose:
    name: compose files validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generic compose
        env:
          APP_PASSWORD: ci-dummy
        run: docker compose -f docker-compose.yml config -q
      - name: rendered reference stack
        env:
          APP_PASSWORD: ci-dummy
        run: |
          cp deploy/.env.example deploy/.env.ci
          bash deploy/deploy.sh --dry-run --env-file deploy/.env.ci
          docker compose -f deploy/.build/stack.yml config -q

  image:
    name: app image builds (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
