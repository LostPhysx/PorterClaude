# PorterClaude php recipe — nginx, running as uid 1000 (`dev`). OWNER: O1.
# Every path nginx writes to must be under /tmp (uid 1000 cannot write /var/run, /var/lib/nginx).
# Port 80 as an unprivileged user works because dockerd sets net.ipv4.ip_unprivileged_port_start=0;
# where it does not, /usr/local/bin/pc-nginx.sh rewrites `listen 80;` to $PC_HTTP_PORT before
# starting nginx (see docker/README.md). Keep the `listen 80;` line spelled exactly like that.
#
# No `user` directive on purpose: the master process is not root, so it would only warn.

daemon off;
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;

  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;
  client_max_body_size 64m;

  server {
    listen 80;
    server_name _;

    root  /workspace/public;
    index index.php index.html;

    location / {
      try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
      include        fastcgi_params;
      fastcgi_pass   127.0.0.1:9000;
      fastcgi_index  index.php;
      fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param  PATH_INFO       $fastcgi_path_info;
      fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
      deny all;
    }
  }
}
